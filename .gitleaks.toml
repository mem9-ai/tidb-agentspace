# gitleaks configuration — https://github.com/gitleaks/gitleaks
#
# Extends the built-in rule set and narrows one false positive: the bundled
# skill installers embed a SHA-256 integrity manifest.
#
# console/public/skills/*/install.py holds
#
#   ASSETS = {"workspace-api.md": "<sha256 of workspace-api.md>", ...}
#
# and gitleaks' generic-api-key rule reports each digest as a key/value secret.
# The values are checksums of the shipped skill assets, not credentials:
#
#   sha256sum console/public/skills/drive9-workspace/workspace-api.md
#   # 93d3acc36e4f55d34bf4700a3634373cfbedd96514a12171af51f9e44cb4ed0b
#
# which reproduces the reported value exactly.
#
# The allowlist matches on the shape of the value plus the path, not on a list
# of today's digests: every skill asset update rewrites the manifest, and a
# value list would make each legitimate update trip the scan and invite a habit
# of appending hashes to this file.
#
# Both conditions must hold (condition = "AND"):
#
#   * the finding is in one of the generated skill installer scripts, and
#   * the detected secret is exactly 64 lowercase hex characters,
#
# which is what a SHA-256 digest looks like. A credential in those files that is
# not a bare 64-character hex string — anything with a prefix, a different
# length, or mixed case — is still reported.
#
# Do not add real credentials here — rotate and remove them instead.

title = "tidb.ai gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "SHA-256 integrity manifest of the bundled skill assets"
paths = ['''console/public/skills/[^/]+/install\.py''']
regexTarget = "secret"
condition = "AND"
regexes = ['''^[0-9a-f]{64}$''']
