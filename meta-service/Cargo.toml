[package]
name = "workspace-meta-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
aes-gcm = "=0.10.3"
anyhow = "=1.0.100"
axum = "=0.8.6"
axum-server = { version = "=0.8.0", features = ["tls-rustls-no-provider"] }
base64 = "=0.22.1"
hex = "=0.4.3"
futures = "=0.3.31"
rustls = { version = "=0.23.34", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "=2.2.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
slatedb = { version = "=0.18.0", default-features = false, features = ["aws", "foyer"] }
subtle = "=2.6.1"
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "=1.18.1", features = ["v4"] }
workspace-contracts = { workspace = true }
workspace-cache-budget = { workspace = true }

[dev-dependencies]
slatedb-common = "=0.18.0"
