name: Temporary Studio publication acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: studio-publication-acceptance
  cancel-in-progress: false
jobs:
  quality:
    if: github.ref == 'refs/heads/diagnostics/studio-publish-acceptance'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Select the pinned npm version
        run: npm install --global npm@11.6.2 --ignore-scripts
      - run: npm ci
      - run: npm run check
  acceptance:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        id: app
        with:
          app-id: ${{ vars.STUDIO_PUBLISH_APP_ID }}
          private-key: ${{ secrets.STUDIO_PUBLISH_APP_PRIVATE_KEY }}
          owner: mem9-ai
          permission-contents: write
          permission-pull-requests: write
          permission-checks: read
      - run: node scripts/studio-publish-acceptance.mjs
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: studio-publication-acceptance
          path: studio-acceptance.json
          retention-days: 3
          if-no-files-found: error
