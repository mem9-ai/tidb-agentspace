name: Internal artifact

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: internal-artifact
  cancel-in-progress: false

jobs:
  package:
    name: Verify and package
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - name: Require reviewed main-branch source
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Select the pinned npm version
        run: npm install --global npm@11.6.2 --ignore-scripts
      - run: npm ci
      - run: npm run check
      - name: Verify source sign-offs
        run: node scripts/check-signoff.mjs '' "$GITHUB_SHA"
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Restore reviewed Rust dependency cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: rust-v1-${{ hashFiles('Cargo.toml', '.cargo/config.toml', 'rust-toolchain.toml', 'scripts/duckdb-runtime.json') }}
          shared-key: backend
          workspaces: . -> meta-service/target
          cache-bin: false
          cache-workspace-crates: false
          save-if: false
      - run: npm run build:api
      - name: Package the internal runtime
        run: node scripts/package-runtime.mjs "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: internal-workspace-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 14
