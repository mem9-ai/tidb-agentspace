name: Deploy API to dev

# Continuous deployment of the TiDB Workspace API server to the dev
# Kubernetes environment. Modeled on the tidbcloud/fs dev CD: build a
# native image, push it to the container registry, then roll the existing
# in-cluster Deployment to the new image and wait for the rollout, undoing it
# on failure.
#
# Releases only update the existing Deployment image.
# All environment identifiers remain runtime inputs, never repository values.

on:
  # Pull requests run only the quality gate (including the no-push
  # native amd64 image build); they never reach the deploy job. This is where
  # the pre-merge Docker validation actually executes.
  pull_request:
    paths:
      - 'backend/**'
      - 'meta-service/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'scripts/duckdb-runtime.json'
      - 'scripts/prepare-duckdb.mjs'
      - 'public/openapi.json'
      - 'scripts/deploy-dev*'
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/dev-cd.yml'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Verify native build/cache, deploy, or inspect configuration read-only
        type: choice
        options: [inspect, verify, deploy]
        default: inspect

permissions:
  contents: read

# Concurrency is split by whether the run can deploy:
#
# - Pull requests (verify only): one group per PR ref, cancel-in-progress so a
#   newer commit on the same PR supersedes the older verify run.
# - Push to main and manual dispatch (can deploy): ONE shared constant group
#   with cancel-in-progress FALSE. Deploy-capable runs therefore queue behind
#   one another and are never cancelled mid-rollout/rollback — a second main
#   push waits for the first run to finish instead of killing it at the
#   workflow level. The deploy job's own constant group keeps that invariant
#   even if this block is later changed.
concurrency:
  group: dev-cd-${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Run the complete quality/native gate before releases. PR image verification
  # runs independently below, so release compilation does not wait for these tests.
  # The repository enforces that every workflow runs `npm run check`.
  verify:
    name: Quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Select the pinned npm version
        run: npm install --global npm@11.6.2 --ignore-scripts
      - run: npm ci
      - run: npm run check
      - name: Install the pinned Rust toolchain
        if: github.event.inputs.operation != 'inspect'
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Check Rust formatting before compiling
        if: github.event.inputs.operation != 'inspect'
        run: npm run backend:fmt
      - name: Restore Rust dependency cache
        if: github.event.inputs.operation != 'inspect'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Keep fallback restores inside the same native-library and build configuration.
          prefix-key: rust-v1-${{ hashFiles('Cargo.toml', '.cargo/config.toml', 'rust-toolchain.toml', 'scripts/duckdb-runtime.json') }}
          shared-key: backend
          workspaces: . -> meta-service/target
          cache-bin: false
          cache-workspace-crates: false
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'pull_request' }}
      - name: Build native backend with Cargo timings
        if: github.event.inputs.operation != 'inspect'
        run: npm run backend:build -- --timings
      - name: Check Rust with Clippy
        if: github.event.inputs.operation != 'inspect'
        run: npm run backend:clippy
      - name: Run Rust unit tests
        if: github.event.inputs.operation != 'inspect'
        run: npm run backend:test
      - name: Install verified RustFS 1.0.4 binary
        if: github.event.inputs.operation != 'inspect'
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="$RUNNER_TEMP/workspace-rustfs"
          mkdir -p "$runtime_dir"
          curl --fail --location --retry 3 https://github.com/rustfs/rustfs/releases/download/1.0.4/rustfs-linux-x86_64-gnu-v1.0.4.zip --output "$runtime_dir/rustfs.zip"
          printf '%s  %s\n' '4a25e48f5b5ae610a679b5324206962c6fb0eb20a9fa7ab6cb20e178cf6c534b' "$runtime_dir/rustfs.zip" | sha256sum --check
          unzip -q "$runtime_dir/rustfs.zip" -d "$runtime_dir"
          chmod +x "$runtime_dir/rustfs"
          printf '%s\n' "$runtime_dir" >> "$GITHUB_PATH"
      - name: Run native API and real S3 integration tests
        if: github.event.inputs.operation != 'inspect'
        run: npm run backend:test:integration

  image:
    name: Native image
    if: github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && github.event.inputs.operation == 'verify')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build native image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          pull: true
          push: false
          load: true
          tags: workspace-api:verify
          cache-from: type=gha,scope=native-api-linux-amd64-v1,version=2,timeout=3m
          cache-to: type=gha,scope=native-api-linux-amd64-v1,version=2,mode=max,timeout=3m,ignore-error=true
      - name: Run the final native image without network or writable root
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --entrypoint /bin/sh workspace-api:verify \
            -ec 'if command -v node; then exit 1; fi; exec workspace-backend runtime-info' \
            > "$RUNNER_TEMP/native-runtime-info.json"
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFileSync } from "node:fs";
            const pins = JSON.parse(readFileSync("scripts/duckdb-runtime.json", "utf8"));
            const info = JSON.parse(readFileSync(process.argv[1], "utf8")).duckdb;
            const target = "x86_64-unknown-linux-gnu";
            assert.deepEqual(info, { version: pins.version, linkage: "static", target,
              archiveSha256: pins.artifacts[target].sha256 });
            console.log(JSON.stringify(info));
          ' "$RUNNER_TEMP/native-runtime-info.json"

  deploy:
    name: Build and deploy to dev
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    needs: verify
    # Never deploy from a pull request — PRs run the quality gate only.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.event.inputs.operation != 'verify'
    # Serialize by the actual deployment target, NOT the source ref: every
    # deploy run (main push or any manual ref) shares this one constant group,
    # so two runs can never interleave `set image` / `rollout` / `rollout undo`
    # on the single dev Deployment. cancel-in-progress is false so an in-flight
    # rollout is never abandoned half-applied.
    concurrency:
      group: dev-cd-deploy-target
      cancel-in-progress: false
    # The protected environment is the explicit secret/approval boundary: the
    # deployment secrets below are available only to this job, not to the
    # quality gate or any repository script that runs earlier.
    environment: dev
    permissions:
      id-token: write
      contents: read
    env:
      IMAGE_TAG: sha-${{ github.sha }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      AWS_ASSUME_ARN: ${{ secrets.AWS_ASSUME_ARN }}
      EKS_CLUSTER: ${{ secrets.DEV_EKS_CLUSTER }}
      DEPLOY_NAMESPACE: ${{ secrets.DEV_DEPLOY_NAMESPACE }}
      K8S_DEPLOYMENT: ${{ secrets.DEV_API_DEPLOYMENT }}
      # Container name within the Deployment. Set this secret when the
      # container name differs from the Deployment name.
      K8S_CONTAINER: ${{ secrets.DEV_API_CONTAINER || secrets.DEV_API_DEPLOYMENT }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Set up kubectl
        env:
          # Match the dev EKS control-plane minor within the +/-1 client skew.
          KUBECTL_VERSION: v1.35.8
          BIN_DIR: ${{ runner.temp }}/bin
        run: |
          set -euo pipefail
          mkdir -p "$BIN_DIR"
          curl -fsSLO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          curl -fsSL "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256" -o kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          install -m 0755 kubectl "$BIN_DIR/kubectl"
          echo "$BIN_DIR" >> "$GITHUB_PATH"
          kubectl version --client

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ env.AWS_ASSUME_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        if: github.event.inputs.operation != 'inspect'
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Build and push image
        id: image
        if: github.event.inputs.operation != 'inspect'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          pull: true
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=native-api-linux-amd64-v1,version=2,timeout=3m
          cache-to: type=gha,scope=native-api-linux-amd64-v1,version=2,mode=max,timeout=3m,ignore-error=true
      - name: Record immutable image digest
        if: github.event.inputs.operation != 'inspect'
        env:
          IMAGE_BASE: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          node --input-type=module -e '
            const digest = process.env.IMAGE_DIGEST;
            if (!/^sha256:[a-f0-9]{64}$/.test(digest)) throw new Error("Missing image digest");
            process.stdout.write(`IMAGE_REF=${process.env.IMAGE_BASE}@${digest}\n`);
          ' >> "$GITHUB_ENV"

      - name: Update kubeconfig
        run: |
          set -euo pipefail
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER" \
            --region "$AWS_REGION"

      - name: Inspect only the target's referenced configuration (names, never values)
        if: github.event.inputs.operation == 'inspect'
        run: node scripts/inspect-native-target.mjs

      - name: Deploy image and verify readiness (restore previous image on failure)
        if: github.event.inputs.operation != 'inspect'
        run: node scripts/deploy-dev.mjs
