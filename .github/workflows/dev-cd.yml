name: Deploy API to dev

# Continuous deployment of the TiDB Workspace API server to the dev
# Kubernetes environment. Modeled on the tidbcloud/fs dev CD: build a
# native image, push it to the container registry, then update the existing
# in-cluster Deployment image. Runtime configuration and recovery are operator-owned.
#
# Releases only update the existing Deployment image.
# All environment identifiers remain runtime inputs, never repository values.

on:
  push:
    branches: [main]
    # Console and documentation changes retain ordinary CI, without releasing an API image.
    paths:
      - 'backend/**'
      - 'meta-service/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'scripts/duckdb-runtime.json'
      - 'scripts/prepare-duckdb.mjs'
      - 'public/openapi.json'
      - 'scripts/deploy-dev*'
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/dev-cd.yml'
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy the native API or explicitly inspect configuration read-only
        type: choice
        options: [deploy, inspect]
        default: deploy

permissions:
  contents: read

# Serialize releases to the existing target, including manual operations.
concurrency:
  group: dev-cd-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Verify same-commit CI
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Require checks from the trusted main CI run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          GATE: ${{ github.event.inputs.operation == 'inspect' && 'console' || 'full' }}
        run: node scripts/require-ci.mjs "$GATE" "$SOURCE_SHA"

  deploy:
    name: Build and deploy to dev
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    needs: verify
    # PR validation belongs to CI; this workflow never runs a PR deployment.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # Serialize by the actual deployment target, NOT the source ref: every
    # deploy run (main push or any manual ref) shares this one constant group,
    # so two runs cannot update the single dev Deployment at the same time.
    # cancel-in-progress is false so an in-flight image update is not cancelled.
    concurrency:
      group: dev-cd-deploy-target
      cancel-in-progress: false
    # The protected environment is the explicit secret/approval boundary: the
    # deployment secrets below are available only to this job, not to the
    # quality gate or any repository script that runs earlier.
    environment: dev
    permissions:
      id-token: write
      contents: read
    env:
      IMAGE_TAG: sha-${{ github.sha }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      AWS_ASSUME_ARN: ${{ secrets.AWS_ASSUME_ARN }}
      EKS_CLUSTER: ${{ secrets.DEV_EKS_CLUSTER }}
      DEPLOY_NAMESPACE: ${{ secrets.DEV_DEPLOY_NAMESPACE }}
      K8S_DEPLOYMENT: ${{ secrets.DEV_API_DEPLOYMENT }}
      # Container name within the Deployment. Set this secret when the
      # container name differs from the Deployment name.
      K8S_CONTAINER: ${{ secrets.DEV_API_CONTAINER || secrets.DEV_API_DEPLOYMENT }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Set up kubectl
        env:
          # Match the dev EKS control-plane minor within the +/-1 client skew.
          KUBECTL_VERSION: v1.35.8
          BIN_DIR: ${{ runner.temp }}/bin
        run: |
          set -euo pipefail
          mkdir -p "$BIN_DIR"
          curl -fsSLO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          curl -fsSL "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256" -o kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          install -m 0755 kubectl "$BIN_DIR/kubectl"
          echo "$BIN_DIR" >> "$GITHUB_PATH"
          kubectl version --client

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ env.AWS_ASSUME_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        if: github.event.inputs.operation != 'inspect'
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Build and push image
        id: image
        if: github.event.inputs.operation != 'inspect'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          pull: true
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=native-api-linux-amd64-v1,version=2,timeout=3m
          cache-to: type=gha,scope=native-api-linux-amd64-v1,version=2,mode=max,timeout=3m,ignore-error=true
      - name: Record immutable image digest
        if: github.event.inputs.operation != 'inspect'
        env:
          IMAGE_BASE: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          node --input-type=module -e '
            const digest = process.env.IMAGE_DIGEST;
            if (!/^sha256:[a-f0-9]{64}$/.test(digest)) throw new Error("Missing image digest");
            process.stdout.write(`IMAGE_REF=${process.env.IMAGE_BASE}@${digest}\n`);
          ' >> "$GITHUB_ENV"

      - name: Update kubeconfig
        run: |
          set -euo pipefail
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER" \
            --region "$AWS_REGION"

      - name: Inspect only the target's referenced configuration (names, never values)
        if: github.event.inputs.operation == 'inspect'
        run: node scripts/inspect-native-target.mjs

      - name: Update Deployment image
        if: github.event.inputs.operation != 'inspect'
        run: node scripts/deploy-dev.mjs

      - name: Confirm Deployment image
        if: github.event.inputs.operation != 'inspect'
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          try {
            const { DEPLOY_NAMESPACE, K8S_DEPLOYMENT, K8S_CONTAINER, IMAGE_REF } = process.env;
            const target = JSON.parse(execFileSync('kubectl', [
              '--request-timeout=30s', 'get', `deployment/${K8S_DEPLOYMENT}`,
              '-n', DEPLOY_NAMESPACE, '-o', 'json',
            ], { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'], timeout: 35000 }));
            const actual = target.spec?.template?.spec?.containers?.find(c => c.name === K8S_CONTAINER)?.image;
            if (!IMAGE_REF || actual !== IMAGE_REF) throw new Error('Image mismatch');
            console.log(`Deployment image confirmed: ${actual.split('@')[1]}`);
          } catch {
            console.error('Deployment image verification failed.');
            process.exitCode = 1;
          }
          NODE
