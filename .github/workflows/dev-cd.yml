name: Deploy API to dev

# Continuous deployment of the TiDB Workspace API server to the dev
# Kubernetes environment. Modeled on the tidbcloud/fs dev CD: build a
# native image, push it to the container registry, then update the existing
# in-cluster Deployment image. Runtime configuration and recovery are operator-owned.
#
# Releases update the existing image, verify readiness, and use an explicitly approved
# compatible recovery image only after a failed Kubernetes rollout.
# All environment identifiers remain runtime inputs, never repository values.

on:
  push:
    branches: [main]
    # Console, documentation and deployment-tool-only changes do not release an API image.
    paths:
      - 'backend/**'
      - 'meta-service/**'
      - 'specs/gh-150/fixtures/us-sales.csv'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'scripts/duckdb-runtime.json'
      - 'LICENSE'
      - 'Dockerfile'
      - '.dockerignore'
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy, inspect, or explicitly recover an unavailable image
        type: choice
        options: [deploy, inspect, recover]
        default: deploy
      verification:
        description: Full CI by default; dev-smoke is an explicitly selected basic dev release
        type: choice
        options: [full, dev-smoke]
        default: full
      failed_image_digest:
        description: Exact failed image digest for recover
        required: false
        type: string
      recovery_image_digest:
        description: Exact compatible recovery image digest for recover
        required: false
        type: string
      recovery_confirmation:
        description: Enter storage-compatible after verifying downgrade and writer safety
        required: false
        type: string

permissions:
  contents: read

# Serialize releases to the existing target, including manual operations.
concurrency:
  group: dev-cd-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Verify same-commit CI
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Require checks from the trusted main CI run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          GATE: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy' && inputs.verification == 'dev-smoke' && 'dev-smoke' || inputs.operation == 'inspect' && 'console' || 'full' }}
        run: node scripts/require-ci.mjs "$GATE" "$SOURCE_SHA"

  prebuild:
    name: Warm the exact-revision image cache
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.operation == 'deploy')
    outputs:
      cache_ready: ${{ steps.image_cache.outcome == 'success' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build without publishing or deployment credentials
        id: image_cache
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          pull: true
          push: false
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=native-api-linux-amd64-v1,version=2,timeout=3m
          cache-to: type=gha,scope=native-api-prewarm-${{ github.sha }},version=2,mode=max,timeout=3m,ignore-error=false

  deploy:
    name: Build and deploy to dev
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    needs: [verify, prebuild]
    # Cache warming is optional; exact-revision CI remains mandatory.
    if: ${{ always() && !cancelled() && needs.verify.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    # Serialize by the actual deployment target, NOT the source ref: every
    # deploy run (main push or any manual ref) shares this one constant group,
    # so two runs cannot update the single dev Deployment at the same time.
    # cancel-in-progress is false so an in-flight image update is not cancelled.
    concurrency:
      group: dev-cd-deploy-target
      cancel-in-progress: false
    # The protected environment is the explicit secret/approval boundary: the
    # deployment secrets below are available only to this job, not to the
    # quality gate or any repository script that runs earlier.
    environment: dev
    permissions:
      id-token: write
      contents: read
    env:
      IMAGE_TAG: sha-${{ github.sha }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      AWS_ASSUME_ARN: ${{ secrets.AWS_ASSUME_ARN }}
      EKS_CLUSTER: ${{ secrets.DEV_EKS_CLUSTER }}
      DEPLOY_NAMESPACE: ${{ secrets.DEV_DEPLOY_NAMESPACE }}
      K8S_DEPLOYMENT: ${{ secrets.DEV_API_DEPLOYMENT }}
      # Container name within the Deployment. Set this secret when the
      # container name differs from the Deployment name.
      K8S_CONTAINER: ${{ secrets.DEV_API_CONTAINER || secrets.DEV_API_DEPLOYMENT }}
      SOURCE_SHA: ${{ github.sha }}
      DEV_ROLLBACK_POLICY: ${{ vars.DEV_ROLLBACK_POLICY }}
      FAILED_IMAGE_DIGEST: ${{ inputs.failed_image_digest }}
      RECOVERY_IMAGE_DIGEST: ${{ inputs.recovery_image_digest }}
      RECOVERY_CONFIRMATION: ${{ inputs.recovery_confirmation }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Set up kubectl
        env:
          # Match the dev EKS control-plane minor within the +/-1 client skew.
          KUBECTL_VERSION: v1.35.8
          BIN_DIR: ${{ runner.temp }}/bin
        run: |
          set -euo pipefail
          mkdir -p "$BIN_DIR"
          curl -fsSLO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          curl -fsSL "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256" -o kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          install -m 0755 kubectl "$BIN_DIR/kubectl"
          echo "$BIN_DIR" >> "$GITHUB_PATH"
          kubectl version --client

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ASSUME_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        if: github.event.inputs.operation != 'inspect' && github.event.inputs.operation != 'recover'
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Build and push image
        id: image
        if: github.event.inputs.operation != 'inspect' && github.event.inputs.operation != 'recover'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          pull: true
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          # Import a single scope: overlapping BuildKit cache manifests can select
          # older workspace layers even when the exact-SHA prewarm was exported.
          cache-from: type=gha,scope=${{ needs.prebuild.outputs.cache_ready == 'true' && format('native-api-prewarm-{0}', github.sha) || 'native-api-linux-amd64-v1' }},version=2,timeout=3m
          cache-to: type=gha,scope=native-api-linux-amd64-v1,version=2,mode=max,timeout=3m,ignore-error=true
      - name: Record immutable image digest
        if: github.event.inputs.operation != 'inspect' && github.event.inputs.operation != 'recover'
        env:
          IMAGE_BASE: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          node --input-type=module -e '
            const digest = process.env.IMAGE_DIGEST;
            if (!/^sha256:[a-f0-9]{64}$/.test(digest)) throw new Error("Missing image digest");
            process.stdout.write(`IMAGE_REF=${process.env.IMAGE_BASE}@${digest}\n`);
          ' >> "$GITHUB_ENV"

      - name: Update kubeconfig
        run: |
          set -euo pipefail
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER" \
            --region "$AWS_REGION"

      - name: Inspect only the target's referenced configuration (names, never values)
        if: github.event.inputs.operation == 'inspect'
        run: node scripts/inspect-native-target.mjs

      - name: Deploy and verify readiness and public API
        if: github.event.inputs.operation != 'inspect' && github.event.inputs.operation != 'recover'
        run: node scripts/deploy-dev.mjs

      - name: Recover a specific unavailable deployment
        if: github.event.inputs.operation == 'recover'
        run: node scripts/deploy-dev.mjs --recover
