name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Main commits have independent evidence; only superseded PR/queue candidates cancel.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

jobs:
  scope:
    name: Change scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ui_only: ${{ steps.scope.outputs.ui_only }}
      backend_only: ${{ steps.scope.outputs.backend_only }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
      history_only: ${{ steps.history_scope.outputs.history_only }}
      classic_profile: ${{ steps.classic_scope.outputs.classic_profile }}
      full_partition: ${{ steps.full_partition.outputs.full_partition }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: (github.event_name == 'pull_request' && github.base_ref == 'main') || github.event_name == 'push'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the candidate using the trusted base policy
        id: scope
        if: (github.event_name == 'pull_request' && github.base_ref == 'main') || github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          policy="$RUNNER_TEMP/ci-ui-scope.mjs"
          policy_ref='HEAD^1'
          if [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then
            if [[ ! "$BEFORE_SHA" =~ ^[a-f0-9]{40}$ ]] || ! git merge-base --is-ancestor "$BEFORE_SHA" HEAD; then
              echo 'ui_only=false' >> "$GITHUB_OUTPUT"
              echo 'backend_only=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            policy_ref="$BEFORE_SHA"
          fi
          if git show "$policy_ref:scripts/ci-ui-scope.mjs" > "$policy"; then
            node "$policy"
          else
            echo 'Base scope policy unavailable; run native and browser checks.'
            echo 'ui_only=false' >> "$GITHUB_OUTPUT"
            echo 'backend_only=false' >> "$GITHUB_OUTPUT"
          fi
          docs_policy="$RUNNER_TEMP/ci-docs-scope.mjs"
          if git show "$policy_ref:scripts/ci-docs-scope.mjs" > "$docs_policy"; then
            node "$docs_policy"
          else
            echo 'docs_only=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Select history integration coverage using the trusted base policy
        id: history_scope
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        shell: bash
        run: |
          set -euo pipefail
          policy="$RUNNER_TEMP/ci-history-scope.mjs"
          if git show 'HEAD^1:scripts/ci-history-scope.mjs' > "$policy"; then
            node "$policy"
          else
            echo 'history_only=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Select classic integration coverage using the trusted base policy
        id: classic_scope
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        shell: bash
        run: |
          set -euo pipefail
          policy="$RUNNER_TEMP/ci-classic-scope.mjs"
          if git show 'HEAD^1:scripts/ci-classic-scope.mjs' > "$policy"; then
            node "$policy"
          else
            echo 'classic_profile=full' >> "$GITHUB_OUTPUT"
          fi
      - name: Select the full integration partition using the trusted base policy
        id: full_partition
        if: (github.event_name == 'pull_request' && github.base_ref == 'main') || github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          policy_ref='HEAD^1'
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then
            if [[ ! "$BASE_SHA" =~ ^[a-f0-9]{40}$ || ! "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]] ||
              [[ "$(git rev-list --parents -n 1 HEAD | wc -w | tr -d ' ')" != '3' ]] ||
              [[ "$(git rev-parse HEAD^1)" != "$BASE_SHA" || "$(git rev-parse HEAD^2)" != "$HEAD_SHA" ]]; then
              echo 'full_partition=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            if [[ ! "$BEFORE_SHA" =~ ^[a-f0-9]{40}$ ]] || ! git merge-base --is-ancestor "$BEFORE_SHA" HEAD; then
              echo 'full_partition=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            policy_ref="$BEFORE_SHA"
          fi
          runner="$RUNNER_TEMP/ci-full-integration.mjs"
          if ! git show "$policy_ref:scripts/ci-full-integration.mjs" > "$runner" || ! node "$runner" classify; then
            echo 'full_partition=false' >> "$GITHUB_OUTPUT"
          fi

  gitleaks:
    name: Secret scan
    # The release digests for this version are pinned below; bump them together
    # with the version, never one without the other.
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      GITLEAKS_LINUX_ARM64_SHA256: e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Runs on `pull_request`, not `pull_request_target`: privileged PR execution
      # is prohibited by scripts/check-repo.mjs, so this job never gets the base
      # repository's secrets and never needs them. It reads the candidate's git
      # objects only — it executes nothing from the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The scanned range and its allowlist are resolved with git, so the
          # base commit must be present locally.
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        # Install the scanner from the pinned release into a per-run directory
        # outside the workspace, and verify the digest as well as the reported
        # version, so a binary committed to the tree can never be the one that
        # runs.
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/gitleaks-bin"
          mkdir -p "$install_dir"
          case "$(uname -m)" in
            x86_64)
              arch=x64
              expected_sha="$GITLEAKS_LINUX_X64_SHA256"
              ;;
            aarch64)
              arch=arm64
              expected_sha="$GITLEAKS_LINUX_ARM64_SHA256"
              ;;
            *)
              echo "unsupported runner architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_${arch}.tar.gz"
          printf '%s  %s\n' "$expected_sha" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$install_dir" gitleaks
          rm -f "$archive"
          scanner="$install_dir/gitleaks"
          case "$scanner" in
            "$GITHUB_WORKSPACE"/*)
              echo "refusing to run a scanner from the checkout" >&2
              exit 1
              ;;
          esac
          reported="$("$scanner" version)"
          if [ "$reported" != "$GITLEAKS_VERSION" ]; then
            echo "refusing to run an unexpected scanner build: version=$reported" >&2
            exit 1
          fi
          echo "scanner: $scanner (gitleaks $reported)"

      - name: Scan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          scanner="$RUNNER_TEMP/gitleaks-bin/gitleaks"
          case "$scanner" in
            "$GITHUB_WORKSPACE"/*)
              echo "refusing to run a scanner from the checkout" >&2
              exit 1
              ;;
          esac
          # `--text` keeps a `.gitattributes` entry (`-diff`/`binary`) from hiding
          # a file from `git log -p`. `--diff-merges=remerge` scans the merge
          # result, so a credential introduced while resolving a conflict is seen,
          # while content merely inherited from the base branch is not re-reported
          # (which plain `-m` would do).
          #
          # A pull request and a merge-queue candidate are scanned for the commits
          # they add; a push or a manual run audits the full history, which is
          # cheap here (~0.6s for this repository).
          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            range="$BASE_SHA..$HEAD_SHA"
            config_ref="$BASE_SHA"
          elif [ -n "$MERGE_BASE_SHA" ] && [ -n "$MERGE_HEAD_SHA" ]; then
            range="$MERGE_BASE_SHA..$MERGE_HEAD_SHA"
            config_ref="$MERGE_BASE_SHA"
          else
            range="--all"
            config_ref="HEAD"
          fi
          log_opts="$range --text --diff-merges=remerge"

          # Read the allowlist from the trusted revision (the base the candidate
          # is measured against), never from the candidate itself. If that
          # revision predates .gitleaks.toml, fall back to the built-in rules
          # with no allowlist — stricter, never the candidate's own copy.
          if git show "$config_ref:.gitleaks.toml" > "$RUNNER_TEMP/gitleaks.toml" 2>/dev/null; then
            echo "allowlist source: $config_ref:.gitleaks.toml"
          else
            printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks.toml"
            echo "allowlist source: built-in defaults, no allowlist ($config_ref has no .gitleaks.toml)"
          fi

          # gitleaks exits 0 with "0 commits scanned" when git cannot read the
          # requested history, so traverse the range first and fail closed.
          if ! git log -p -U0 $log_opts >/dev/null 2>&1; then
            echo "cannot read the full history of '$log_opts' (missing objects or an unknown revision)" >&2
            exit 1
          fi

          # `--diff-merges=remerge` emits no patch for merges with three or more
          # parents, so such a commit could hide a credential; refuse to report a
          # pass instead of scanning nothing for it.
          octopus="$(git rev-list --merges --min-parents=3 $range)"
          if [ -n "$octopus" ]; then
            echo "octopus merge(s) in '$range' cannot be remerge-diffed:" >&2
            echo "$octopus" >&2
            echo "re-create the merge with two parents, or review its result manually" >&2
            exit 1
          fi

          # Belt and braces: the allowlist and ignore lookups must never resolve
          # inside the checkout.
          rm -f "$GITHUB_WORKSPACE/.gitleaksignore"

          # --ignore-gitleaks-allow: an inline `gitleaks:allow` comment is a
          # suppression, and a candidate should not be able to suppress its own
          # finding.
          "$scanner" git . --no-banner --redact \
            --config "$RUNNER_TEMP/gitleaks.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP" \
            --ignore-gitleaks-allow \
            --log-opts="$log_opts"

  quality:
    name: Quality
    needs: scope
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Locate the pinned Node toolchain
        id: node_pin
        run: &node_toolchain_pin |
          echo "path=$RUNNER_TOOL_CACHE/node/$(cat .node-version)" >> "$GITHUB_OUTPUT"
          echo "npm=$(node -p 'require("./package.json").packageManager')" >> "$GITHUB_OUTPUT"
      - name: Restore the pinned Node toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with: &node_toolchain_cache
          path: ${{ steps.node_pin.outputs.path }}
          key: node-toolchain-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.node-version') }}-${{ steps.node_pin.outputs.npm }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Verify the pinned npm toolchain
        env: &node_toolchain_env
          PINNED_NPM: ${{ steps.node_pin.outputs.npm }}
        run: &node_toolchain_npm |
          if [[ "npm@$(npm --version)" != "$PINNED_NPM" ]]; then
            npm install --global "$PINNED_NPM" --ignore-scripts
          fi
      - run: npm ci
      - name: Install zsh for agent launch compatibility tests
        if: ${{ needs.scope.outputs.docs_only != 'true' }}
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh
      - run: npm run check
        if: ${{ needs.scope.outputs.docs_only != 'true' }}
      - name: Check documentation and repository policy
        if: ${{ needs.scope.outputs.docs_only == 'true' }}
        run: npm run check:runtime && npm run check:repo && npm run format:check
      - name: Save the frontend for review
        if: ${{ needs.scope.outputs.docs_only != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: console-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  metadata:
    name: Rust backend and S3 integration
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.ui_only != 'true' && needs.scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Check Rust formatting before compiling
        run: cargo fmt --all --check
      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Keep fallback restores inside the same native-library and build configuration.
          prefix-key: rust-v1-${{ hashFiles('Cargo.toml', '.cargo/config.toml', 'rust-toolchain.toml', 'scripts/duckdb-runtime.json') }}
          shared-key: backend
          workspaces: . -> meta-service/target
          cache-bin: false
          cache-workspace-crates: false
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'pull_request' }}
      - name: Build native backend with Cargo timings
        run: cargo run --locked -p workspace-build-tools -- prepare && cargo build --locked --workspace --bins --examples --timings
      - name: Check Rust with Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run Rust unit tests
        if: ${{ needs.scope.outputs.history_only == 'true' || contains(fromJSON('["tutorial","database","files"]'), needs.scope.outputs.classic_profile) || needs.scope.outputs.full_partition != 'true' }}
        run: cargo test --workspace --locked
      - name: Run workspace tests outside the native acceptance partitions
        if: ${{ needs.scope.outputs.history_only != 'true' && !contains(fromJSON('["tutorial","database","files"]'), needs.scope.outputs.classic_profile) && needs.scope.outputs.full_partition == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          # Each top-level acceptance test file is already built and run by its owner.
          # Select all other test targets from Cargo's actual workspace, including future additions.
          cargo metadata --locked --no-deps --format-version 1 | jq -r --arg acceptance "$PWD/backend/test-support/tests" '
            .packages[].targets[] | select(.test) |
            select(.kind[0] == "test" or .kind[0] == "example" or .kind[0] == "bench") |
            select(.src_path != ($acceptance + "/" + .name + ".rs")) |
            "--" + .kind[0], .name
          ' > "$RUNNER_TEMP/workspace-unit-targets"
          targets=(--lib --bins)
          while IFS= read -r arg; do targets+=("$arg"); done < "$RUNNER_TEMP/workspace-unit-targets"
          cargo test --workspace --locked "${targets[@]}"
          cargo test --workspace --locked --doc
      - name: Install verified RustFS 1.0.4 binary
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="$RUNNER_TEMP/workspace-rustfs"
          mkdir -p "$runtime_dir"
          curl --fail --location --retry 3 https://dl.rustfs.com/artifacts/rustfs/release/rustfs-linux-x86_64-gnu-v1.0.4.zip --output "$runtime_dir/rustfs.zip"
          printf '%s  %s\n' '4a25e48f5b5ae610a679b5324206962c6fb0eb20a9fa7ab6cb20e178cf6c534b' "$runtime_dir/rustfs.zip" | sha256sum --check
          unzip -q "$runtime_dir/rustfs.zip" -d "$runtime_dir"
          chmod +x "$runtime_dir/rustfs"
          printf '%s\n' "$runtime_dir" >> "$GITHUB_PATH"
      - name: Run native API and real S3 integration tests
        if: ${{ needs.scope.outputs.history_only != 'true' && !contains(fromJSON('["tutorial","database","files"]'), needs.scope.outputs.classic_profile) && needs.scope.outputs.full_partition != 'true' }}
        run: cargo acceptance all
      - name: Run remaining native API and real S3 integration tests
        if: ${{ needs.scope.outputs.history_only != 'true' && !contains(fromJSON('["tutorial","database","files"]'), needs.scope.outputs.classic_profile) && needs.scope.outputs.full_partition == 'true' }}
        env:
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          policy_ref='HEAD^1'
          if [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then policy_ref="$BEFORE_SHA"; fi
          runner="$RUNNER_TEMP/workspace-verify"
          git show "$policy_ref:backend/build-tools/src/bin/workspace-verify.rs" > "$runner.rs"
          rustc --edition=2024 "$runner.rs" -o "$runner"
          "$runner" other
      - name: Run history authorization, isolation and storage integration tests
        if: ${{ needs.scope.outputs.history_only == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          runner="$RUNNER_TEMP/workspace-verify"
          git show 'HEAD^1:backend/build-tools/src/bin/workspace-verify.rs' > "$runner.rs"
          rustc --edition=2024 "$runner.rs" -o "$runner"
          "$runner" history
      - name: Run classic and risk-specific integration tests
        if: ${{ needs.scope.outputs.history_only != 'true' && contains(fromJSON('["tutorial","database","files"]'), needs.scope.outputs.classic_profile) }}
        env:
          CLASSIC_PROFILE: ${{ needs.scope.outputs.classic_profile }}
        shell: bash
        run: |
          set -euo pipefail
          runner="$RUNNER_TEMP/workspace-verify"
          git show 'HEAD^1:backend/build-tools/src/bin/workspace-verify.rs' > "$runner.rs"
          rustc --edition=2024 "$runner.rs" -o "$runner"
          "$runner" "$CLASSIC_PROFILE"
      - name: Locate the pinned Node toolchain
        id: node_pin
        if: needs.scope.outputs.history_only != 'true' && !contains(fromJSON('["tutorial","database","files"]'), needs.scope.outputs.classic_profile)
        run: *node_toolchain_pin
      - name: Reuse the pinned Node toolchain from Quality
        if: needs.scope.outputs.history_only != 'true' && !contains(fromJSON('["tutorial","database","files"]'), needs.scope.outputs.classic_profile)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with: *node_toolchain_cache
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.scope.outputs.history_only != 'true' && !contains(fromJSON('["tutorial","database","files"]'), needs.scope.outputs.classic_profile)
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verify the pinned npm toolchain
        if: needs.scope.outputs.history_only != 'true' && !contains(fromJSON('["tutorial","database","files"]'), needs.scope.outputs.classic_profile)
        env: *node_toolchain_env
        run: *node_toolchain_npm
      - name: Install dependencies for the public SDK tests
        if: needs.scope.outputs.history_only != 'true' && !contains(fromJSON('["tutorial","database","files"]'), needs.scope.outputs.classic_profile)
        run: npm ci --workspace=tools/agent-client-tests --ignore-scripts --no-audit --no-fund
      - name: Exercise the published JavaScript client against native services
        if: needs.scope.outputs.history_only != 'true' && !contains(fromJSON('["tutorial","database","files"]'), needs.scope.outputs.classic_profile)
        run: npm run test:agent-clients -- ./meta-service/target/debug/client-fixture
      - name: Save Cargo timing reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-timings-${{ github.sha }}-${{ github.run_attempt }}
          path: meta-service/target/cargo-timings/
          if-no-files-found: ignore
          retention-days: 7

  product_integration:
    name: Native product integration
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.full_partition == 'true' && needs.scope.outputs.history_only != 'true' && !contains(fromJSON('["tutorial","database","files"]'), needs.scope.outputs.classic_profile) && needs.scope.outputs.ui_only != 'true' && needs.scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      BEFORE_SHA: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: rust-v1-${{ hashFiles('Cargo.toml', '.cargo/config.toml', 'rust-toolchain.toml', 'scripts/duckdb-runtime.json') }}
          shared-key: backend
          workspaces: . -> meta-service/target
          cache-bin: false
          cache-workspace-crates: false
          save-if: false
      - name: Build product test services
        run: |
          cargo run --locked -p workspace-build-tools -- prepare
          # This product target also selects the dev-dependencies used by the acceptance runner.
          cargo build --locked --workspace --profile test --bin workspace-backend --bin workspace-meta-service --test product
      - name: Install verified RustFS 1.0.4 binary
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="$RUNNER_TEMP/workspace-rustfs"
          mkdir -p "$runtime_dir"
          curl --fail --location --retry 3 https://dl.rustfs.com/artifacts/rustfs/release/rustfs-linux-x86_64-gnu-v1.0.4.zip --output "$runtime_dir/rustfs.zip"
          printf '%s  %s\n' '4a25e48f5b5ae610a679b5324206962c6fb0eb20a9fa7ab6cb20e178cf6c534b' "$runtime_dir/rustfs.zip" | sha256sum --check
          unzip -q "$runtime_dir/rustfs.zip" -d "$runtime_dir"
          chmod +x "$runtime_dir/rustfs"
          printf '%s\n' "$runtime_dir" >> "$GITHUB_PATH"
      - name: Run product API integration tests
        shell: bash
        run: |
          set -euo pipefail
          policy_ref='HEAD^1'
          if [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then policy_ref="$BEFORE_SHA"; fi
          runner="$RUNNER_TEMP/workspace-verify"
          git show "$policy_ref:backend/build-tools/src/bin/workspace-verify.rs" > "$runner.rs"
          rustc --edition=2024 "$runner.rs" -o "$runner"
          "$runner" product

  backend-scope:
    name: Backend-only scope
    needs: [scope, metadata, product_integration]
    if: ${{ always() && !cancelled() && needs.scope.outputs.backend_only == 'true' && needs.metadata.result == 'success' && (needs.product_integration.result == 'success' || (needs.product_integration.result == 'skipped' && (needs.scope.outputs.full_partition != 'true' || needs.scope.outputs.history_only == 'true' || contains(fromJSON('["tutorial","database","files"]'), needs.scope.outputs.classic_profile)))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Record browser applicability after native API verification
        run: echo 'Native-only change; Console and public contract inputs unchanged. Native API/S3 verification passed. Browser smoke is not applicable.'

  documentation-scope:
    name: Documentation-only scope
    needs: [scope, quality]
    if: ${{ !cancelled() && needs.scope.outputs.docs_only == 'true' && needs.quality.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Record applicability after Quality
        run: echo 'Documentation-only change; application, contract and workflow inputs unchanged. Quality passed. Native and browser verification are not applicable.'

  browser:
    name: Browser smoke
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.backend_only != 'true' && needs.scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Select the pinned npm version
        run: npm install --global npm@11.6.2 --ignore-scripts
      - run: npm ci
      - name: Build the same candidate Console
        run: npm run build:console
      - name: Install Chromium only
        run: npx playwright install chromium --with-deps
      - name: Assert Console user journeys against isolated fixtures
        run: npm run test:browser
      - name: Save browser diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-diagnostics-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  image:
    name: Native image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      image_built: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Select native image validation
        id: changes
        run: node scripts/ci-image-inputs.mjs
      - name: Set up Docker Buildx
        if: steps.changes.outputs.changed == 'true'
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build native image (no push)
        if: steps.changes.outputs.changed == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          pull: true
          push: false
          load: true
          tags: workspace-api:verify
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: |
            type=gha,scope=native-api-pr-${{ github.event.pull_request.number }},version=2,timeout=3m
            type=gha,scope=native-api-linux-amd64-v1,version=2,timeout=3m
          cache-to: type=gha,scope=native-api-pr-${{ github.event.pull_request.number }},version=2,mode=max,timeout=3m,ignore-error=true
      - name: Run the final native image without network or writable root
        if: steps.changes.outputs.changed == 'true'
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' workspace-api:verify)" = "$SOURCE_SHA"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --entrypoint /bin/sh workspace-api:verify \
            -ec 'if command -v node; then exit 1; fi; exec workspace-backend runtime-info' \
            > "$RUNNER_TEMP/native-runtime-info.json"
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFileSync } from "node:fs";
            const pins = JSON.parse(readFileSync("scripts/duckdb-runtime.json", "utf8"));
            const info = JSON.parse(readFileSync(process.argv[1], "utf8")).duckdb;
            const target = "x86_64-unknown-linux-gnu";
            assert.deepEqual(info, { version: pins.version, linkage: "static", target,
              archiveSha256: pins.artifacts[target].sha256 });
            console.log(JSON.stringify(info));
          ' "$RUNNER_TEMP/native-runtime-info.json"
      - name: Benchmark incremental native image rebuild
        if: ${{ steps.changes.outputs.changed == 'true' && contains(github.event.pull_request.body, '[benchmark-native-cache]') }}
        timeout-minutes: 10
        run: bash scripts/benchmark-native-image-cache.sh

  image-cache-transfer:
    name: Native image cache transfer
    needs: image
    if: ${{ github.event_name == 'pull_request' && needs.image.result == 'success' && needs.image.outputs.image_built == 'true' && contains(github.event.pull_request.body, '[benchmark-cache-transfer]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Restore only the previous job's image cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          pull: true
          push: false
          load: true
          tags: workspace-api:cache-transfer
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=native-api-pr-${{ github.event.pull_request.number }},version=2,timeout=3m
      - name: Verify the final source layer was restored
        run: |
          set -euo pipefail
          docker buildx history logs --progress plain > "$RUNNER_TEMP/cache-transfer.log" 2>&1
          cat "$RUNNER_TEMP/cache-transfer.log"
          layer="$(grep -E '^#[0-9]+ \[builder [^]]+\] RUN find backend/host ' "$RUNNER_TEMP/cache-transfer.log" | head -n 1 | cut -d ' ' -f 1)"
          test -n "$layer"
          grep -Eq "^${layer} CACHED([[:space:]]|$)" "$RUNNER_TEMP/cache-transfer.log"
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint /usr/local/bin/workspace-backend workspace-api:cache-transfer runtime-info
