[workspace]
members = ["meta-service", "backend/contracts", "backend/meta-client", "backend/workspace", "backend/identity", "backend/api", "backend/host", "backend/providers", "backend/execute", "backend/product"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
anyhow = "=1.0.100"
axum = "=0.8.6"
base64 = "=0.22.1"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
getrandom = "=0.3.4"
hex = "=0.4.3"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "json", "stream", "form"] }
rustls = { version = "=0.23.34", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "signal", "sync", "net", "time", "process", "fs", "io-util", "io-std"] }
uuid = { version = "=1.18.1", features = ["v4"] }
workspace-contracts = { path = "backend/contracts" }
workspace-meta-client = { path = "backend/meta-client" }
workspace-meta-service = { path = "meta-service" }
workspace-domain = { path = "backend/workspace" }
workspace-identity = { path = "backend/identity" }
workspace-api = { path = "backend/api" }

workspace-providers = { path = "backend/providers" }
workspace-execute = { path = "backend/execute" }
workspace-product = { path = "backend/product" }
async-trait = "=0.1.89"
bashkit = { version = "=0.19.0", default-features = false }
duckdb = { version = "=1.20000.1", default-features = false, features = ["chrono"] }
regex = "=1.12.3"
sqlparser = { version = "=0.63.0", features = ["visitor"] }
percent-encoding = "=2.3.2"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "bigdecimal", "json"] }
tempfile = "=3.23.0"
futures = "=0.3.31"
tokio-util = { version = "=0.7.19", features = ["rt"] }

mysql_async = { version = "=0.37.1", default-features = false, features = ["minimal-rust", "rustls-tls", "ring", "tls12"] }

jsonwebtoken = { version = "=10.3.0", default-features = false, features = ["rust_crypto"] }
