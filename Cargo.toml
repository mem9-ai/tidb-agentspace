[workspace]
members = ["meta-service", "backend/contracts", "backend/meta-client", "backend/workspace", "backend/api", "backend/host"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
anyhow = "=1.0.100"
axum = "=0.8.6"
base64 = "=0.22.1"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
getrandom = "=0.3.4"
hex = "=0.4.3"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "json", "stream"] }
rustls = { version = "=0.23.34", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "signal", "sync", "net", "time"] }
uuid = { version = "=1.18.1", features = ["v4"] }
workspace-contracts = { path = "backend/contracts" }
workspace-meta-client = { path = "backend/meta-client" }
workspace-meta-service = { path = "meta-service" }
workspace-domain = { path = "backend/workspace" }
workspace-api = { path = "backend/api" }
